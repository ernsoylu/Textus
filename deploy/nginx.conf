# Serves the Textus SPA and proxies the Supabase API (Envoy gateway, "api-gw") over the shared
# Docker network, so the browser only ever talks to this origin and API calls skip the public gateway.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Documents go up to 500 MB (§7.4); stream them instead of buffering to disk.
  client_max_body_size 512m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Resolved per request (Docker's embedded DNS), so nginx starts even when Supabase is down.
  location ~ ^/(auth|rest|storage|functions)/v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $supabase http://api-gw:8000;
    proxy_pass $supabase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite fingerprints everything under /assets/, so it can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
