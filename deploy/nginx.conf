# Serves the Textus SPA and proxies the Supabase API (Envoy gateway, "api-gw") over the shared
# Docker network, so the browser only ever talks to this origin and API calls skip the public gateway.
map $uri $textus_document_disposition {
  default $upstream_http_content_disposition;
  ~^/storage/v1/object/(sign|authenticated)/documents/ "attachment";
}
log_format textus_privacy '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log textus_privacy;

  # Documents go up to 500 MB (§7.4); stream them instead of buffering to disk.
  client_max_body_size 512m;

  # add_header in a location replaces the ones inherited from the server, so the security headers live in one
  # snippet that every location that sets its own headers includes again.
  include /etc/nginx/snippets/security-headers.conf;

  # The JS/CSS bundles are ~3.7 MB raw and ~1 MB gzipped. Books, PDFs and images are not listed: they are already
  # compressed, and compressing them would break the range requests pdf.js makes.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Resolved per request (Docker's embedded DNS), so nginx starts even when Supabase is down.
  location ~ ^/(auth|rest|storage|functions)/v1/ {
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition $textus_document_disposition always;
    include /etc/nginx/snippets/security-headers.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $supabase http://api-gw:8000;
    proxy_pass $supabase;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite fingerprints everything under /assets/, so it can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # nginx's stock mime.types has no .mjs, so pdf.js' module worker would be sent as application/octet-stream and
  # refused by the browser (module scripts need a JavaScript MIME type). A regex location beats the /assets/ prefix.
  location ~* ^/assets/.+\.mjs$ {
    default_type text/javascript;
    types { }
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
