  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # Content-Security-Policy (README "Security"): scripts only from this origin; the API is proxied under the same
  # origin, so connect-src needs nothing else. 'unsafe-inline' styles are React's style attributes;
  # 'wasm-unsafe-eval' is pdf.js' image decoders; fonts come from Google Fonts (index.html). blob: is pdf.js' and
  # DjVu.js' workers and foliate-js' book iframes, whose stylesheets, fonts and images are blob: URLs too. Book
  # iframes inherit this policy, so scripts inside a book never run (foliate-js requires exactly that).
  # If you build with VITE_SUPABASE_URL pointing at another origin, add it to connect-src.
  # challenges.cloudflare.com serves the Turnstile script and its challenge iframe on the sign-in pages.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: blob:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
