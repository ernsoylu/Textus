# Read by SonarCloud automatic analysis.
#
# src/types/database.ts is generated by `supabase gen types` and must not be edited by hand
# (CLAUDE.md), so style rules on it are noise.
sonar.exclusions=src/types/database.ts

# plsql:S1192 ("duplicated literal") on SQL: applied migrations are immutable (CLAUDE.md), and the
# RLS test deliberately repeats fixture UUIDs and role names so each assertion reads on its own.
sonar.issue.ignore.multicriteria=sql1
sonar.issue.ignore.multicriteria.sql1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sql1.resourceKey=supabase/**/*.sql
