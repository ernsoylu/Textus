# Textus web on the same host as self-hosted Supabase. It joins Supabase's compose network
# (supabase_default) so nginx reaches the gateway at api-gw:8000 directly.
#
#   echo 'VITE_SUPABASE_ANON_KEY=<publishable key>' > .env
#   docker compose up -d --build
services:
  textus:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: textus-web:latest
    container_name: textus-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${TEXTUS_PORT:-8080}:8080"
    networks:
      - supabase

networks:
  supabase:
    name: supabase_default
    external: true
