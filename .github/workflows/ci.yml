name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Snyk (dependency vulnerabilities)
    runs-on: ubuntu-latest
    # GitHub does not provide repository secrets to forked pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependencies with Snyk
        uses: snyk/actions/node@b075801f26076be9bb50521154cafab73f44da0c # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  frontend:
    name: Frontend (type-check, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: no dependency lifecycle scripts run in CI (none are needed to type-check, test or build).
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    name: Database (migrations + RLS isolation test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      # `supabase start` applies every file in supabase/migrations/, in order, against a
      # fresh local Postgres — the same Postgres distribution (pgtap/pg_trgm/pg_cron
      # included) as the self-hosted deployment. It fails loudly on a bad migration instead
      # of that surfacing only when someone runs `db push` against a real server.
      - run: supabase start
      # Default local ports/credentials for `supabase start` (stable across CLI versions,
      # unlike relying on `supabase status`'s output format).
      - name: Run pgTAP tests (RLS isolation, library search and paging)
        run: |
          for f in rls_isolation library_page; do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "supabase/tests/database/$f.test.sql" | tee "pgtap-$f.log"
            if grep -q 'not ok' "pgtap-$f.log"; then
              echo "::error::pgTAP reported failing assertions in $f"
              exit 1
            fi
          done
      - name: Export local Supabase credentials
        run: supabase status -o env | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Run Edge Function integration flow
        run: |
          supabase functions serve --no-verify-jwt > /tmp/textus-functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/export)
            if [ "$code" != "000" ] && [ "$code" != "502" ]; then break; fi
            sleep 1
          done
          if [ "$code" = "000" ] || [ "$code" = "502" ]; then cat /tmp/textus-functions.log; exit 1; fi
          if ! deno test --allow-env --allow-net supabase/tests/functions/integration.test.ts; then
            cat /tmp/textus-functions.log
            exit 1
          fi

  edge-functions:
    name: Edge Functions (Deno type-check + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts
      - name: deno check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "::group::deno check $f"
            deno check --config supabase/functions/deno.jsonc "$f"
            echo "::endgroup::"
          done
      - name: deno lint
        run: deno lint supabase/functions
